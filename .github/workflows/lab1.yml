name: Lab 1 — metrics collector

on:
  push:
    branches: [ "main" ]
    paths: [ "lab1/**", ".github/workflows/lab1.yml" ]
  pull_request:
    branches: [ "main" ]
    paths: [ "lab1/**", ".github/workflows/lab1.yml" ]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: lab1/metrics-collector

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0

    - name: Test with Gradle Wrapper
      run: ./gradlew test

    - name: Smoke-run benchmark and consistency check
      run: |
        ./gradlew -q benchmark --args="double-buffer 1 2 --seconds 0.2 --runs 1 --warmup 0.2"
        ./gradlew -q consistency --args="double-buffer --snapshots 1000"
